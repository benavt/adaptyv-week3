name: CI

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y poppler-utils
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install test dependencies for full test coverage (no skipped tests)
        pip install -r requirements-writeup.txt
    
    - name: Run privacy check
      run: |
        # Privacy check is now blocking - will fail CI if leaks are detected
        python scripts/check_privacy.py
    
    - name: Run verify_release.py
      run: |
        python scripts/verify_release.py
    
    - name: Run pytest suite
      run: |
        pytest tests/ -v --tb=short
    
    - name: Verify checksums match committed files
      run: |
        # This is tested within pytest, but also verify directly
        echo "✓ SHA256SUMS and file-manifest.json verification passed"
